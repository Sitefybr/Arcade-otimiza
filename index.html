<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlockWorld</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#69bce9;font-family:Arial}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}#ui{position:fixed;top:10px;left:10px;color:#fff;background:#0009;padding:10px;border-radius:10px;line-height:1.5;font-size:13px;user-select:none}#bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:#0009;padding:6px;border-radius:9px}.slot{width:48px;height:48px;border:2px solid #777;background:#222;display:grid;place-items:center;position:relative;font-size:25px}.sel{border-color:#fff;box-shadow:0 0 0 2px #111}.n{position:absolute;top:2px;left:4px;color:#fff;font-size:11px}.q{position:absolute;right:4px;bottom:2px;color:#fff;font-size:11px}</style></head><body><canvas id="c"></canvas><div id="ui"><b>BLOCKWORLD</b><br>WASD/setas: mover • Espaço: pular<br>🖱️ Esquerdo: quebrar • Direito: colocar<br>1–6: escolher bloco • R: novo mundo</div><div id="bar"></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),bar=document.getElementById('bar');let W,H,cam={x:0,y:0};function rs(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',rs);rs();
const S=32,WW=240,WH=90,types=['grass','dirt','stone','wood','leaves','sand'],col={grass:'#53b748',dirt:'#87542e',stone:'#777',wood:'#99652f',leaves:'#27823a',sand:'#d9c27b'},emoji=['🌿','🟫','🪨','🪵','🍃','🟨'];let w=[],inv={grass:50,dirt:50,stone:30,wood:20,leaves:10,sand:20},sel=0,keys={},mouse={x:0,y:0},p={x:12,y:20,vx:0,vy:0,on:false};
function gen(){w=Array.from({length:WH},()=>Array(WW).fill(''));let h=27;for(let X=0;X<WW;X++){h=Math.max(18,Math.min(38,h+(Math.random()<.5?-1:1)));for(let Y=h;Y<WH;Y++)w[Y][X]=Y==h?'grass':Y<h+4?'dirt':'stone';if(Math.random()<.045&&X>4&&X<WW-5){for(let Y=1;Y<=4;Y++)w[h-Y][X]='wood';for(let Y=h-6;Y<=h-3;Y++)for(let X2=X-2;X2<=X+2;X2++)if(Math.abs(X2-X)+Math.abs(Y-(h-5))<4)w[Y][X2]='leaves'}}p={x:12,y:h-1,vx:0,vy:0,on:false}}gen();
function solid(X,Y){return X<0||X>=WW||Y>=WH||(Y>=0&&w[Y][X])}function hit(nx,ny){for(let Y=Math.floor(ny-1.7);Y<=Math.floor(ny);Y++)for(let X=Math.floor(nx-.35);X<=Math.floor(nx+.35);X++)if(solid(X,Y))return true;return false}
function upd(dt){let a=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0);p.vx+=a*18*dt;if(!a)p.vx*=.86;p.vx=Math.max(-5,Math.min(5,p.vx));p.vy+=22*dt;if((keys[' ']||keys.w||keys.ArrowUp)&&p.on){p.vy=-8.5;p.on=false}let nx=p.x+p.vx*dt;if(!hit(nx,p.y))p.x=nx;else p.vx=0;let ny=p.y+p.vy*dt;if(!hit(p.x,ny)){p.y=ny;p.on=false}else{if(p.vy>0)p.on=true;p.vy=0}cam.x+=(p.x*S-W/2-cam.x)*.12;cam.y+=(p.y*S-H/2-cam.y)*.12;cam.x=Math.max(0,Math.min(WW*S-W,cam.x));cam.y=Math.max(0,Math.min(WH*S-H,cam.y))}
function block(t,X,Y){x.fillStyle=col[t];x.fillRect(X,Y,S,S);x.fillStyle='#0002';x.fillRect(X,Y+23,S,9);x.fillStyle='#fff2';x.fillRect(X,Y,S,3);if(t==='stone'){x.fillStyle='#5558';for(let i=0;i<4;i++)x.fillRect(X+5+(i*11)%22,Y+7+(i*9)%20,4,3)}}
function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#62b9ed');g.addColorStop(1,'#d8f2ff');x.fillStyle=g;x.fillRect(0,0,W,H);for(let Y=Math.floor(cam.y/S)-1;Y<Math.ceil((cam.y+H)/S)+1;Y++)for(let X=Math.floor(cam.x/S)-1;X<Math.ceil((cam.x+W)/S)+1;X++)if(X>=0&&X<WW&&Y>=0&&Y<WH&&w[Y][X])block(w[Y][X],X*S-cam.x,Y*S-cam.y);let px=p.x*S-cam.x,py=p.y*S-cam.y;x.fillStyle='#e4ad84';x.fillRect(px-10,py-51,20,20);x.fillStyle='#2460b0';x.fillRect(px-11,py-30,22,30);x.fillStyle='#111';x.fillRect(px-6,py-45,4,4);x.fillRect(px+3,py-45,4,4);let tx=Math.floor((mouse.x+cam.x)/S),ty=Math.floor((mouse.y+cam.y)/S);x.strokeStyle='#fff';x.lineWidth=2;x.strokeRect(tx*S-cam.x+1,ty*S-cam.y+1,S-2,S-2);bar.innerHTML='';types.forEach((t,i)=>{let d=document.createElement('div');d.className='slot '+(i===sel?'sel':'');d.innerHTML='<span class=n>'+(i+1)+'</span>'+emoji[i]+'<span class=q>'+inv[t]+'</span>';bar.appendChild(d)})}
function target(){return{x:Math.floor((mouse.x+cam.x)/S),y:Math.floor((mouse.y+cam.y)/S)}}function reach(t){return Math.hypot(t.x+.5-p.x,t.y+.5-(p.y-.7))<5}function br(){let t=target();if(reach(t)&&w[t.y]?.[t.x]){let b=w[t.y][t.x];w[t.y][t.x]='';inv[b]++}}function put(){let t=target(),b=types[sel];if(reach(t)&&t.x>=0&&t.x<WW&&t.y>=0&&t.y<WH&&!w[t.y][t.x]&&inv[b]>0){w[t.y][t.x]=b;inv[b]--}}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key>='1'&&e.key<='6')sel=+e.key-1;if(e.key.toLowerCase()==='r')gen();if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=0);c.onmousemove=e=>{mouse.x=e.clientX;mouse.y=e.clientY};c.onmousedown=e=>e.button===0?br():e.button===2?put():0;c.oncontextmenu=e=>e.preventDefault();let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
